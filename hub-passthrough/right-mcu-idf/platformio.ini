; PlatformIO build for the MAKCM Right MCU hub host (native ESP-IDF, hub-enabled).
;
; Uses the pioarduino platform fork, which ships ESP-IDF 5.5.4 — the version with
; the external-hub driver AND the low-speed-behind-full-speed-hub fix. Crucially,
; framework=espidf builds ESP-IDF *from source*, so CONFIG_USB_HOST_HUBS_SUPPORTED=y
; in sdkconfig.defaults actually takes effect (impossible with framework=arduino,
; which ships precompiled IDF libs).
;
; Build:   pio run
; Flash:   pio run -t upload -e right_hub   (set the COM port if needed)
; Monitor: pio device monitor

[platformio]
; Keep the ESP-IDF-standard "main" component directory (also works with native idf.py).
src_dir = main

[env:right_hub]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
monitor_speed = 115200
